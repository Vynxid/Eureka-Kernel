name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "exynos7885-a10_defconfig"

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 100

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils make python3 libssl-dev build-essential \
          bc bison flex unzip ca-certificates xz-utils \
          mkbootimg cpio device-tree-compiler git git-lfs
        git clone https://github.com/kdrag0n/proton-clang --depth=1 -b master
        make clean
        make mrproper

    - name: GetTime
      id: get_time
      run: |
        echo "TIME=$(TZ=UTC+7 date +%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Build Kernel
      run: |
        export PROTON_PATH=$(pwd)/proton-clang/bin
        export PATH=$PROTON_PATH:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC="ccache clang"
        # Use GNU ld instead of lld to avoid --lto-O3 issues
        export LD=aarch64-linux-gnu-ld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJDUMP=llvm-objdump
        export OBJCOPY=llvm-objcopy
        export STRIP=llvm-strip
        export KCFLAGS=-w
        export ANDROID_MAJOR_VERSION=r
        # Disable LTO flags to prevent linker errors
        export KBUILD_LDFLAGS=""

        make O=out $KERNEL_DEFCONFIG
        # Disable LTO and related options that cause linker issues
        scripts/config --file out/.config -d LTO -d LTO_CLANG -d CFI_CLANG
        # Enable A10 specific configs
        scripts/config --file out/.config -e ARCH_SUNXI -e MACH_SUN4I
        # Disable problematic LCD driver that uses floating point
        scripts/config --file out/.config -d DRM_PANEL_S6D7AT0B_A10
        scripts/config --file out/.config -d FB_S6D7AT0B_A10
        # Patch floating point issue before build
        if [ -f drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c ]; then
          sed -i 's/lcd->custom_brightness \* 1\.2/(lcd->custom_brightness * 12) \/ 10/g' drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_lcd_ctrl.c
        fi
        if [ -f drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_boe_lcd_ctrl.c ]; then
          sed -i 's/lcd->custom_brightness \* 1\.2/(lcd->custom_brightness * 12) \/ 10/g' drivers/video/fbdev/exynos/dpu_7885/panels/s6d7at0b_a10_boe_lcd_ctrl.c
        fi
        make O=out olddefconfig
        make O=out -j$(nproc --all)

    - name: Package kernel
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md

        if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
          cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
        elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        elif [[ -f out/arch/arm64/boot/Image ]]; then
          cp out/arch/arm64/boot/Image AnyKernel3/Image
        fi

        if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        fi

    - name: Upload kernel to artifact
      uses: actions/upload-artifact@v4
      with:
        name: final-kernel
        path: AnyKernel3/