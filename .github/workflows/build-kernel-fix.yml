name: Build Kernel with Eureka Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      # Fixed KERNEL_DEFCONFIG for Samsung Galaxy A10
      KERNEL_DEFCONFIG: "exynos7885-a10_defconfig"
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 100

    - name: Initialize submodules
      run: git submodule update --init --recursive

    - name: Setup KernelSU-Next
      run: |
        # Remove existing KernelSU setup
        rm -rf KernelSU-Next KernelSU drivers/kernelsu
        # Install latest KernelSU-Next 1.0.9
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.9
        # Verify installation
        ls -la drivers/kernelsu/
        ls -la drivers/kernelsu/Kconfig || echo "Kconfig not found"

    - name: Cache proton-clang
      uses: actions/cache@v3
      id: cache-proton
      with:
        path: proton-clang
        key: proton-clang-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          proton-clang-${{ runner.os }}-

    - name: Cache APT packages
      uses: actions/cache@v3
      with:
        path: /var/cache/apt/archives
        key: apt-cache-${{ runner.os }}-${{ hashFiles('**/build-kernel.yml') }}
        restore-keys: |
          apt-cache-${{ runner.os }}-

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils make python3 python2 libssl-dev build-essential \
          bc bison flex unzip ca-certificates xz-utils \
          mkbootimg cpio device-tree-compiler git git-lfs expect
        
        # Only download proton-clang if not cached
        if [ "${{ steps.cache-proton.outputs.cache-hit }}" != 'true' ]; then
          rm -rf proton-clang
          git clone https://github.com/kdrag0n/proton-clang --depth=1 -b master
        fi
        
        make clean
        make mrproper

    - name: GetTime
      id: get_time
      run: |
        echo "TIME=$(TZ=UTC+7 date +%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Run Eureka build script
      run: |
        chmod +x build.sh # Ensure your script has execute permissions

        # Create an expect script to automate user input for Galaxy A10
        cat << 'EOF' > eureka_automation.exp
        #!/usr/bin/expect -f
        set timeout 600
        exp_internal 1

        # Start the Eureka script
        spawn ./build.sh

        # Enter number of cores (empty to use all)
        expect {
            "*cores*" { send "\r"; exp_continue }
            "*compiler*" { send "\r"; exp_continue }
            "*Leave blank*" { send "\r"; exp_continue }
            timeout { puts "Timeout waiting for cores prompt"; exit 1 }
        }

        # Enter kernel version (15)
        expect {
            "*kernel version*" { send "15\r"; exp_continue }
            "*without*" { send "15\r"; exp_continue }
            timeout { puts "Timeout waiting for version prompt"; exit 1 }
        }

        # Enter build_user (lotusify)
        expect {
            "*build_user*" { send "lotusify\r"; exp_continue }
            "*define*" { send "lotusify\r"; exp_continue }
            timeout { puts "Timeout waiting for build_user prompt"; exit 1 }
        }
        
        # Choose SELinux state (1 for Enforcing)
        expect {
            "*SElinux*" { send "1\r"; exp_continue }
            "*choice*" { send "1\r"; exp_continue }
            timeout { puts "Timeout waiting for SELinux prompt"; exit 1 }
        }

        # Select device SM_A105X (1)
        expect {
            "*device*" { send "1\r"; exp_continue }
            "*select*" { send "1\r"; exp_continue }
            timeout { puts "Timeout waiting for device prompt"; exit 1 }
        }
        
        # Select Android Version OneUI 3 (2)
        expect {
            "*Android*" { send "2\r"; exp_continue }
            "*Version*" { send "2\r"; exp_continue }
            timeout { puts "Timeout waiting for Android version prompt"; exit 1 }
        }

        # Wait for completion
        expect {
            eof { puts "Script completed successfully" }
            timeout { puts "Script timed out"; exit 1 }
        }
        EOF
        
        # Give execute permission and run the expect script
        chmod +x eureka_automation.exp
        ./eureka_automation.exp

    - name: Package kernel
      run: |
        echo "Packaging and preparing for upload..."
        # Check if kernel zip was created successfully
        if [ -d "kernel_zip/anykernel" ]; then
          echo "Kernel build completed successfully"
          ls -la kernel_zip/anykernel/
        else
          echo "Warning: kernel_zip/anykernel directory not found"
          find . -name "*.zip" -type f 2>/dev/null || echo "No zip files found"
        fi

    - name: Upload kernel to artifact
      uses: actions/upload-artifact@v4
      with:
        # The artifact will contain the flashable zip generated by the script
        name: Eureka_Kernel_A10_R15_${{ github.run_number }}
        path: |
          kernel_zip/anykernel/
          kernel_zip/aroma/
          *.zip
        if-no-files-found: warn
